image: eclipse-temurin:21-jdk

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: maven-cache
  paths:
        - .m2/repository

stages:
    - build
    - test

build:
  stage: build
  script:
        - chmod +x mvnw
        - ./mvnw -B -DskipTests package
  artifacts:
    paths:
            - target/*.jar
    expire_in: 1 week

test:
  stage: test
  script:
        - chmod +x mvnw
        - ./mvnw -B test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml